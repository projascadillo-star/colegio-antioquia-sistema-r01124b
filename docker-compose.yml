services:
  auth-service:
    build: ./auth-service
    ports:
      - "3001:3001"
    env_file:
      - ./auth-service/.env

  usuarios-service:
    build: ./usuarios-service
    ports:
      - "3002:3002"
    env_file:
      - ./usuarios-service/.env

  notas-service:
    build: ./notas-service
    ports:
      - "3003:3003"
    env_file:
      - ./notas-service/.env

  asistencia-service:
    build: ./asistencia-service
    ports:
      - "3004:3004"
    env_file:
      - ./asistencia-service/.env

  gateway:
    build: ./gateway
    ports:
      - "3000:3000"
    environment:
      AUTH_SERVICE_URL: http://auth-service:3001
      USUARIOS_SERVICE_URL: http://usuarios-service:3002
      NOTAS_SERVICE_URL: http://notas-service:3003
      ASISTENCIA_SERVICE_URL: http://asistencia-service:3004
    depends_on:
      - auth-service
      - usuarios-service
      - notas-service
      - asistencia-service
